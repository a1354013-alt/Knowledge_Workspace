[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-workspace-backend"
version = "5.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "python-multipart==0.0.6",
    "pydantic==2.5.0",
    "python-dotenv==1.0.0",
    "pyjwt==2.12.1",
    "chromadb==0.4.17",
    "numpy<2",
    "pypdf==3.17.1",
    "requests==2.31.0",
    "httpx==0.24.1",
    "pytesseract==0.3.10",
    "Pillow==10.1.0",
    "Markdown==3.7",
    "slowapi==0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-timeout==2.4.0",
    "ruff==0.15.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
