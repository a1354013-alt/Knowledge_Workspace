[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-workspace"
version = "5.0.0"
description = "Knowledge Workspace full-stack verification environment"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.137.1,<0.138.0",
    "starlette>=1.3.1,<1.4.0",
    "uvicorn[standard]==0.24.0",
    "python-multipart>=0.0.32,<0.1.0",
    "pydantic>=2.9.0,<3.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "pyjwt==2.13.0",
    "chromadb==0.4.17",
    "numpy<2",
    "pypdf>=6.13.2,<7.0.0",
    "requests>=2.34.2,<3.0.0",
    "httpx>=0.28.1,<0.29.0",
    "pytesseract==0.3.10",
    "Pillow>=12.2.0,<13.0.0",
    "Markdown>=3.10.2,<4.0.0",
    "slowapi==0.1.9",
    "aiohttp>=3.14.1,<4.0.0",
    "h11>=0.16.0,<0.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio==0.21.1",
    "pytest-timeout==2.4.0",
    "pip-audit==2.9.0",
    "ruff==0.15.11",
    "setuptools>=82.0.1",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
