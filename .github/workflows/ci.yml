name: ci

on:
  push:
  pull_request:

jobs:
  test-build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Repo hygiene
        run: python scripts/verify_repo_hygiene.py

      - name: Text encoding check
        run: python scripts/check_text_encoding.py

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Python runtime check
        run: python scripts/check_python_version.py

      - name: Python dependency audit
        run: python scripts/audit_python.py

      - name: Backend compile check
        run: python scripts/safe_compile.py -q .

      - name: Backend lint
        run: python -m ruff check backend scripts

      - name: Backend pytest
        timeout-minutes: 5
        env:
          JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
          DEFAULT_OWNER_PASSWORD: OwnerPass123!
          DATABASE_PATH: ./ci_test.db
          UPLOAD_DIR: ./ci_uploads
          PHOTO_DIR: ./ci_photos
          CHROMA_DB_PATH: ./ci_chroma
          AUTOTEST_DIR: ./ci_autotest
          AUTOTEST_MODE: simulated
          KNOWLEDGE_WORKSPACE_PYTEST_TIMEOUT: "180"
        run: python scripts/run_backend_tests.py

      - name: Export OpenAPI schema
        run: python scripts/export_openapi.py

      - name: Check generated frontend API types
        run: python scripts/generate_api_types.py --check

      - name: Check committed contract artifacts
        run: git diff --exit-code docs/openapi.json frontend/src/api/generated/api-types.ts

      - name: Version consistency
        run: python scripts/check_version_consistency.py

      - name: Index consistency
        env:
          JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
          DEFAULT_OWNER_PASSWORD: OwnerPass123!
          DATABASE_PATH: ./ci_test.db
          UPLOAD_DIR: ./ci_uploads
          PHOTO_DIR: ./ci_photos
          CHROMA_DB_PATH: ./ci_chroma
          AUTOTEST_DIR: ./ci_autotest
          AUTOTEST_MODE: simulated
        run: python scripts/check_index_consistency.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend tests
        working-directory: frontend
        run: npm run test:run

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend browser smoke
        working-directory: frontend
        run: npm run test:e2e:ci

      - name: Package release zip
        run: python scripts/package_release.py ./knowledge_workspace_release.zip

      - name: Verify release zip
        run: python scripts/verify_release.py knowledge_workspace_release.zip

      - name: Start backend (for smoke)
        env:
          JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
          DEFAULT_OWNER_PASSWORD: OwnerPass123!
          DATABASE_PATH: ./ci_documents.db
          UPLOAD_DIR: ./ci_uploads
          PHOTO_DIR: ./ci_photos
          CHROMA_DB_PATH: ./ci_chroma
          AUTOTEST_DIR: ./ci_autotest
          AUTOTEST_MODE: simulated
        run: |
          cd backend
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../ci_backend.log 2>&1 &
          echo $! > ../ci_backend.pid

      - name: Wait for backend ready
        run: |
          python - <<'PY'
          import sys
          import time
          import urllib.request

          url = "http://127.0.0.1:8000/api/health"
          deadline = time.time() + 60

          while time.time() < deadline:
            try:
              with urllib.request.urlopen(url, timeout=5) as resp:
                if resp.status == 200:
                  print("Backend is ready")
                  sys.exit(0)
            except Exception:
              time.sleep(1)

          print("Backend did not become ready in time")
          sys.exit(1)
          PY

      - name: Smoke check
        run: |
          python scripts/smoke_check.py --password "OwnerPass123!"

      - name: Stop backend
        if: always()
        run: |
          if [ -f ci_backend.pid ]; then
            kill "$(cat ci_backend.pid)" || true
          fi
          echo "===== ci_backend.log ====="
          cat ci_backend.log || true
