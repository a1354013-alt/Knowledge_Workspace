[pytest]
addopts = -p no:cacheprovider
testpaths = backend/tests
norecursedirs = .git .venv .venv node_modules frontend/node_modules backend/pytest_run backend/pytest_runtime backend/openapi_runtime .pytest-tmp .pytest-run .pytest-runtime .openapi-runtime
timeout = 45
timeout_method = thread
filterwarnings =
    ignore:.*urllib3 .* doesn't match a supported version.*:requests.exceptions.RequestsDependencyWarning
